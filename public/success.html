<main id="main">
<div class="reader">
  <div class="title-block"><h1 id="s-h">Thank you</h1></div>
  <div class="prose" id="s-body">
    <p>Checking your order.</p>
  </div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var sid = q.get("session_id");
  var h = document.getElementById("s-h"), b = document.getElementById("s-body");
  var mail = '<a href="mailto:york@yorksims.com">york@yorksims.com</a>';
  function show(title, html) { h.textContent = title; b.innerHTML = html; }
  function fallback() {
    show("Payment received", "<p>Thanks for the order. If you were expecting a PDF and don't see a download here, email " + mail + " with your receipt and I'll send it myself.</p><p><a class=\"read-link\" href=\"/books\">Back to the books</a></p>");
  }
  if (!sid) { fallback(); return; }
  fetch("/api/download?session_id=" + encodeURIComponent(sid) + "&check=1")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (o) {
      if (!o || !o.paid || !o.bookId) { fallback(); return; }
      var title = o.title ? "<em>" + o.title + "</em>" : "your book";
      var dl = "/api/download?session_id=" + encodeURIComponent(sid);
      var btn = o.fileReady
        ? '<p><a class="btn primary" href="' + dl + '">Download the PDF</a></p>'
        : "<p>The PDF isn't attached to this order yet. Email " + mail + " with your receipt and I'll send it to you directly.</p>";
      if (o.format === "print") {
        show("Order received", "<p>Thanks for buying the paperback of " + title + ". It ships from Folsom, California, to the address you gave at checkout within two business days, with a tracking number sent to your email when it goes out.</p><p>The PDF is included, so you can start reading now.</p>" + btn + "<p class=\"small\">Keep this page's link. The download keeps working if you need the file again. Questions: " + mail + ".</p>");
      } else {
        show("Your book is ready", "<p>Thanks for buying the PDF of " + title + ".</p>" + btn + "<p class=\"small\">Keep this page's link. The download keeps working if you need the file again. If anything goes wrong, email " + mail + " with your receipt.</p>");
      }
    })
    .catch(fallback);
})();
</script>
